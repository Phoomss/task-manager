stages:
  - test
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  BACKEND_IMAGE: $CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG-$CI_PIPELINE_ID
  FRONTEND_IMAGE: $CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG-$CI_PIPELINE_ID

# Cache node_modules globally across jobs by default
cache:
  key:
    files:
      - backend/package-lock.json
      - frontend/package-lock.json
  paths:
    - backend/.npm/
    - frontend/.npm/
    - backend/node_modules/
    - frontend/node_modules/

# --- TEST STAGE ---
lint-and-test:
  stage: test
  image: node:20-alpine
  before_script:
    - cd backend && npm ci --cache .npm --prefer-offline && cd ../
    - cd frontend && npm ci --cache .npm --prefer-offline && cd ../
  script:
    # Run linting
    - cd backend && npm run lint && cd ../
    - cd frontend && npm run lint && cd ../
    # Run tests
    - cd backend && npm run test -- --coverage && cd ../
    - cd frontend && npm run test -- --coverage || echo "Skipping frontend tests since script might not exist"
  artifacts:
    name: "test-coverage-reports"
    when: always
    expire_in: 1 week
    paths:
      - backend/coverage/
      - frontend/coverage/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# --- BUILD STAGE ---
build-images:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    # Build and Push Backend
    - docker build --cache-from $CI_REGISTRY_IMAGE/backend:latest -t $BACKEND_IMAGE -t $CI_REGISTRY_IMAGE/backend:latest ./backend
    - docker push $BACKEND_IMAGE
    - docker push $CI_REGISTRY_IMAGE/backend:latest
    # Build and Push Frontend
    - docker build --cache-from $CI_REGISTRY_IMAGE/frontend:latest -t $FRONTEND_IMAGE -t $CI_REGISTRY_IMAGE/frontend:latest ./frontend
    - docker push $FRONTEND_IMAGE
    - docker push $CI_REGISTRY_IMAGE/frontend:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# --- DEPLOY STAGES (Staging & Production) ---
deploy-to-staging:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: staging
    url: https://staging.taskspace.local
  script:
    - echo "Deploying current build to Staging Kubernetes namespace"
    # Switch kube context or configure kubeconfig via file variable $KUBECONFIG
    - sed -i "s|image: .*backend:.*|image: $BACKEND_IMAGE|g" infrastructure/k8s/02-backend-deployment.yaml
    - sed -i "s|image: .*frontend:.*|image: $FRONTEND_IMAGE|g" infrastructure/k8s/01-frontend-deployment.yaml
    - kubectl apply -f infrastructure/k8s/00-namespace.yaml --namespace=task-manager-staging
    - kubectl apply -f infrastructure/k8s/ --namespace=task-manager-staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy-to-production:
  stage: deploy
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://taskspace.local
  script:
    - echo "Deploying current build to Production Kubernetes namespace"
    - sed -i "s|image: .*backend:.*|image: $BACKEND_IMAGE|g" infrastructure/k8s/02-backend-deployment.yaml
    - sed -i "s|image: .*frontend:.*|image: $FRONTEND_IMAGE|g" infrastructure/k8s/01-frontend-deployment.yaml
    - kubectl apply -f infrastructure/k8s/00-namespace.yaml --namespace=task-manager-prod
    - kubectl apply -f infrastructure/k8s/ --namespace=task-manager-prod
  when: manual # Production deployment requires manual gate/approval
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
