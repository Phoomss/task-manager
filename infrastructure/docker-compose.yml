version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: taskspace-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=taskmanager
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - taskspace-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskmanager"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: taskspace-backend
    ports:
      - "3000:3000"
      - "9229:9229"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/taskmanager?schema=public
    volumes:
      - ../backend:/app
      - /app/node_modules
    networks:
      - taskspace-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: taskspace-frontend
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    volumes:
      - ../frontend:/app
      - /app/node_modules
    networks:
      - taskspace-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  taskspace-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
